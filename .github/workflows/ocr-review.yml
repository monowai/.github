name: OpenCodeReview (reusable)

# Shared AI code review for the Beancounter repos. Callers live in
# beancounter, bc-view, svc-retire and svc-rebalance as a ~20-line workflow
# that owns the triggers and delegates the job here.
#
# Wraps the first-party composite action alibaba/open-code-review, pinned to a
# release tag. That action installs the ocr CLI, checks out the trusted base at
# fetch-depth 0, fetches the head blobs, and posts inline comments plus a
# sticky summary.
#
# Callers pin this workflow at @v1. To roll a change out everywhere, move the
# v1 tag — the same convention actions/checkout uses for its major tags. That
# is what keeps this from being a four-repo sync chore.
#
# The caller must pass OCR_LLM_AUTH_TOKEN explicitly. `secrets: inherit` would
# hand every caller secret to a workflow defined in a public repo; only the one
# secret is needed.

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR number, for workflow_dispatch callers. Empty on ready_for_review."
        required: false
        type: string
      llm_url:
        description: "LLM endpoint. Defaults to DeepSeek's OpenAI-compatible route."
        required: false
        type: string
        default: https://api.deepseek.com/chat/completions
      llm_model:
        description: "Model name."
        required: false
        type: string
        default: deepseek-v4-pro
      llm_use_anthropic:
        description: "'true' for the Anthropic protocol, 'false' for OpenAI-compatible."
        required: false
        type: string
        default: "false"
    secrets:
      OCR_LLM_AUTH_TOKEN:
        description: "API key for the LLM endpoint."
        required: true

jobs:
  review:
    name: OpenCodeReview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    # Two things are excluded here:
    #
    # Drafts. Callers trigger on `opened` as well as `ready_for_review`, so
    # that a PR opened straight into the ready state gets reviewed too —
    # `ready_for_review` alone only ever fires on a draft->ready transition,
    # which silently skipped any normally-opened PR. A PR opened as a draft
    # fires `opened` with draft: true and is skipped here; it gets its review
    # later, when it is promoted. So each PR is still reviewed exactly once on
    # becoming ready, by whichever of the two events applies.
    #
    # Fork PRs, which never receive secrets under the `pull_request` trigger,
    # so the review would fail on an empty token rather than say anything
    # useful. Only bites where the calling repo is public (beancounter), but
    # harmless everywhere else.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      # workflow_dispatch carries no pull_request payload, so the base ref and
      # head SHA have to be resolved from the PR number. On ready_for_review
      # these stay empty and the action falls back to the event payload.
      - name: Resolve dispatch target
        id: target
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          # Passed through env and quoted rather than interpolated into the
          # command, and constrained to digits so it can never be read as a
          # flag by gh.
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "::error::pr_number must be digits only, got: $PR_NUMBER"
              exit 1
              ;;
          esac
          pr=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                 --json baseRefName,headRefOid,isDraft)
          if [ "$(jq -r .isDraft <<<"$pr")" = "true" ]; then
            echo "::error::PR #${PR_NUMBER} is still a draft — promote it or review it locally."
            exit 1
          fi
          {
            echo "base_ref=$(jq -r .baseRefName <<<"$pr")"
            echo "head_sha=$(jq -r .headRefOid <<<"$pr")"
          } >> "$GITHUB_OUTPUT"

      - name: Run OpenCodeReview
        id: review
        # Allowed to fail so the next step can tell the two kinds of failure
        # apart. An exhausted LLM credit balance (HTTP 402) is an account state
        # on the review provider, not a defect in the PR, and a bare red X says
        # the opposite. Any other failure is re-raised there unchanged.
        continue-on-error: true
        uses: alibaba/open-code-review@v1.11.0
        with:
          llm_url: ${{ inputs.llm_url }}
          llm_model: ${{ inputs.llm_model }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_use_anthropic: ${{ inputs.llm_use_anthropic }}
          base_ref: ${{ steps.target.outputs.base_ref }}
          head_sha: ${{ steps.target.outputs.head_sha }}
          # Update one summary comment in place instead of stacking a new one
          # on every run.
          sticky_summary: "true"
          # Only append inline comments that do not overlap an existing bot
          # comment, so a dispatched re-run after fixes does not repeat itself.
          # History is never deleted.
          incremental: "true"
          # Raw JSON result + stderr land as run artifacts, which is what makes
          # a disputed finding checkable after the fact.
          upload_artifacts: "true"

      # The action writes the CLI's stdout to /tmp/ocr-result.json and its
      # stderr to /tmp/ocr-stderr.log before failing the job, and both survive
      # into this step. A provider that rejects every request for lack of
      # credit shows up there as HTTP 402 — in the rendered retry report
      # ("rejected by provider (HTTP 402) -> failed") and as a status_code on
      # the report's attempt records.
      #
      # That case gets a plain-English PR comment and a green job: nothing is
      # wrong with the branch, nothing is blocked, and the fix is an admin
      # topping up the LLM account. Everything else re-fails the job as before.
      - name: Explain or re-raise review failure
        if: steps.review.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Quoted through env rather than interpolated into the script body.
          # Digit-validated above for the dispatch path; the event path is a
          # number from the payload.
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          LLM_URL: ${{ inputs.llm_url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };

            const stderr = read('/tmp/ocr-stderr.log');
            const result = read('/tmp/ocr-result.json');
            const outOfCredit =
              /rejected by provider \(HTTP 402\)|HTTP 402|402 Payment Required|insufficient[ _]balance|insufficient_quota/i.test(stderr) ||
              /"status_code"\s*:\s*402/.test(result);

            if (!outOfCredit) {
              core.setFailed(
                'OpenCodeReview failed for a reason other than provider billing. ' +
                'See the step log above and the ocr-review-result artifact on this run.'
              );
              return;
            }

            const host = (() => {
              try { return new URL(process.env.LLM_URL || '').host; } catch { return 'the LLM provider'; }
            })();
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const MARKER = '<!-- ocr-credit-notice -->';
            const body = [
              MARKER,
              '### 🪙 AI review unavailable — provider credit exhausted',
              '',
              `The review never ran: **${host}** rejected the request with **HTTP 402 (Payment Required)**.`,
              'That is a billing state on the AI account behind the reviewer — **not** a problem with this',
              'pull request, its branch, or its diff.',
              '',
              '- No findings were produced, and none were lost.',
              '- This check is advisory; nothing here blocks the merge.',
              '- **Admin action:** top up the AI credit balance, then re-run the review with',
              '  `gh workflow run ocr-review.yml -f pr_number=' + (process.env.PR_NUMBER || '<N>') + '`',
              '',
              `<sub>[Workflow run](${runUrl}) · the full provider response is in the run's \`ocr-review-result\` artifact.</sub>`,
            ].join('\n');

            const prNumber = Number(process.env.PR_NUMBER);
            if (Number.isInteger(prNumber) && prNumber > 0) {
              const { owner, repo } = context.repo;
              // Sticky: one notice per PR, rewritten in place, so repeated
              // runs against an empty balance do not stack up.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              const existing = comments.find((c) => c.body && c.body.includes(MARKER));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            } else {
              core.warning('No PR number resolved; skipping the PR comment.');
            }

            core.warning(
              `AI review skipped: ${host} returned HTTP 402 (out of credit). ` +
              'Top up the AI account and re-run the review — the PR itself is fine.'
            );
            await core.summary.addRaw(body.replace(MARKER, '')).write();
