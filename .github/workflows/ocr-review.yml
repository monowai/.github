name: OpenCodeReview (reusable)

# Shared AI code review for the Beancounter repos. Callers live in
# beancounter, bc-view, svc-retire and svc-rebalance as a ~20-line workflow
# that owns the triggers and delegates the job here.
#
# Wraps the first-party composite action alibaba/open-code-review, pinned to a
# release tag. That action installs the ocr CLI, checks out the trusted base at
# fetch-depth 0, fetches the head blobs, and posts inline comments plus a
# sticky summary.
#
# Callers pin this workflow at @v1. To roll a change out everywhere, move the
# v1 tag — the same convention actions/checkout uses for its major tags. That
# is what keeps this from being a four-repo sync chore.
#
# The caller must pass OCR_LLM_AUTH_TOKEN explicitly. `secrets: inherit` would
# hand every caller secret to a workflow defined in a public repo; only the one
# secret is needed.

on:
  workflow_call:
    inputs:
      pr_number:
        description: >-
          Unused. Kept so existing `gh workflow run ... -f pr_number=N` calls
          still parse and reach the explanatory failure rather than a cryptic
          "unexpected input" error. Dispatch cannot post a review — see the
          Reject unsupported dispatch step.
        required: false
        type: string
      llm_url:
        description: "LLM endpoint. Defaults to DeepSeek's OpenAI-compatible route."
        required: false
        type: string
        default: https://api.deepseek.com/chat/completions
      llm_model:
        description: "Model name."
        required: false
        type: string
        default: deepseek-v4-pro
      llm_use_anthropic:
        description: "'true' for the Anthropic protocol, 'false' for OpenAI-compatible."
        required: false
        type: string
        default: "false"
    secrets:
      OCR_LLM_AUTH_TOKEN:
        description: "API key for the LLM endpoint."
        required: true

jobs:
  review:
    name: OpenCodeReview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    # Three things are excluded here:
    #
    # Drafts. Callers trigger on `opened` as well as `ready_for_review`, so
    # that a PR opened straight into the ready state gets reviewed too —
    # `ready_for_review` alone only ever fires on a draft->ready transition,
    # which silently skipped any normally-opened PR. A PR opened as a draft
    # fires `opened` with draft: true and is skipped here; it gets its review
    # later, when it is promoted. So each PR is still reviewed exactly once on
    # becoming ready, by whichever of the two events applies.
    #
    # Fork PRs, which never receive secrets under the `pull_request` trigger,
    # so the review would fail on an empty token rather than say anything
    # useful. Only bites where the calling repo is public (beancounter), but
    # harmless everywhere else.
    #
    # Renovate PRs (renovate/* branches). Version bumps have nothing for an AI
    # reviewer to say, and each review bills the metered LLM account. Renovate
    # runs as the hosted Mend app, whose PRs open ready and fire `opened`, so
    # without this filter every one of them would be reviewed. Keep the app's
    # default `renovate/` branch prefix. A workflow_dispatch with an explicit
    # PR number still reviews one on request.
    #
    # Markdown-only PRs are excluded too, but a step down — see "Detect
    # docs-only change". Skipping there keeps the check green instead of
    # skipped, because the diff is fine and nothing should look otherwise.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !startsWith(github.event.pull_request.head.ref, 'renovate/'))
    steps:
      # workflow_dispatch is NOT supported by the review action, and the failure
      # is expensive: the review runs to completion (billing the metered LLM
      # account) and only then throws while posting, so nothing reaches the PR.
      #
      # alibaba/open-code-review resolves the PR from `context.issue.number`
      # and, up to v1.11.0, the head SHA from
      # `context.payload.pull_request.head.sha`. A workflow_dispatch event
      # carries neither. v1.12.1 takes the SHA from the result manifest
      # instead, but still has no way to learn the PR number and offers no
      # input to supply one, so bumping the pin does not fix this — it only
      # moves the failure later.
      #
      # Fail before the review step rather than after, and point at the path
      # that does work: converting the PR to draft and back to ready re-fires
      # `ready_for_review`, which is a supported trigger and costs one review.
      - name: Reject unsupported dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          {
            echo "::error::Dispatching this workflow cannot post a review."
            echo "The review action reads the PR number and head SHA from the"
            echo "event payload, and workflow_dispatch has neither. Running it"
            echo "anyway bills a full review and then fails while posting."
            echo ""
            echo "To re-review PR #${PR_NUMBER:-<N>} after fixes, convert it to"
            echo "a draft and back to ready — that re-fires ready_for_review."
          } >&2
          exit 1

      # A PR that only touches Markdown has nothing for a code reviewer to
      # find, and every run bills the metered LLM account, so the review is
      # skipped here rather than at job level — the check still reports, and
      # still reports green.
      #
      # "Docs" is deliberately narrow: a file counts only if it ends in .md or
      # .mdx. Anything else in the diff puts the whole PR back in scope,
      # including a script that happens to sit under docs/.
      #
      # workflow_dispatch is never skipped. Dispatching a review by hand is the
      # escape hatch for a prose change that does warrant one — there is no
      # per-repo opt-out to configure, and none is wanted for the repos on this
      # workflow today.
      - name: Detect docs-only change
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          # Only read on the event path. The dispatch path returns before this
          # is touched, so the caller-supplied number never reaches the API.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `|| true` so a transient API failure cannot fail the review job:
          # it leaves $files empty, which is handled below as "review it".
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
                    --paginate --jq '.[].filename' || true)
          # An empty list means the API told us nothing usable — a PR always has
          # files. Fall through and review it rather than skip on a bad read.
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvE '\.mdx?$'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Note skipped review
        if: steps.scope.outputs.docs_only == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          note="Markdown-only pull request — AI review skipped, nothing is blocked."
          echo "::notice::${note} Want one anyway? Add a non-Markdown change, or convert the PR to a draft and back to ready."
          {
            echo "### 📝 AI review skipped — Markdown only"
            echo
            echo "$note Every changed file ends in \`.md\` or \`.mdx\`, and each"
            echo "review bills a metered LLM account."
            echo
            echo "Want one anyway? Add a non-Markdown change, or convert the PR to a draft and back to ready."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run OpenCodeReview
        id: review
        if: steps.scope.outputs.docs_only != 'true'
        # Allowed to fail so the next step can tell the two kinds of failure
        # apart. An exhausted LLM credit balance (HTTP 402) is an account state
        # on the review provider, not a defect in the PR, and a bare red X says
        # the opposite. Any other failure is re-raised there unchanged.
        continue-on-error: true
        uses: alibaba/open-code-review@v1.11.0
        with:
          llm_url: ${{ inputs.llm_url }}
          llm_model: ${{ inputs.llm_model }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_use_anthropic: ${{ inputs.llm_use_anthropic }}
          # Update one summary comment in place instead of stacking a new one
          # on every run.
          sticky_summary: "true"
          # Only append inline comments that do not overlap an existing bot
          # comment, so a dispatched re-run after fixes does not repeat itself.
          # History is never deleted.
          incremental: "true"
          # Raw JSON result + stderr land as run artifacts, which is what makes
          # a disputed finding checkable after the fact.
          upload_artifacts: "true"

      # The action writes the CLI's stdout to /tmp/ocr-result.json and its
      # stderr to /tmp/ocr-stderr.log before failing the job, and both survive
      # into this step. A provider that rejects every request for lack of
      # credit shows up there as HTTP 402 — in the rendered retry report
      # ("rejected by provider (HTTP 402) -> failed") and as a status_code on
      # the report's attempt records.
      #
      # That case gets a plain-English PR comment and a green job: nothing is
      # wrong with the branch, nothing is blocked, and the fix is an admin
      # topping up the LLM account. Everything else re-fails the job as before.
      - name: Explain or re-raise review failure
        if: steps.review.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Quoted through env rather than interpolated into the script body.
          # Digit-validated above for the dispatch path; the event path is a
          # number from the payload.
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          LLM_URL: ${{ inputs.llm_url }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };

            const stderr = read('/tmp/ocr-stderr.log');
            const result = read('/tmp/ocr-result.json');
            const outOfCredit =
              /rejected by provider \(HTTP 402\)|HTTP 402|402 Payment Required|insufficient[ _]balance|insufficient_quota/i.test(stderr) ||
              /"status_code"\s*:\s*402/.test(result);

            if (!outOfCredit) {
              core.setFailed(
                'OpenCodeReview failed for a reason other than provider billing. ' +
                'See the step log above and the ocr-review-result artifact on this run.'
              );
              return;
            }

            const host = (() => {
              try { return new URL(process.env.LLM_URL || '').host; } catch { return 'the LLM provider'; }
            })();
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const MARKER = '<!-- ocr-credit-notice -->';
            const body = [
              MARKER,
              '### 🪙 AI review unavailable — provider credit exhausted',
              '',
              `The review never ran: **${host}** rejected the request with **HTTP 402 (Payment Required)**.`,
              'That is a billing state on the AI account behind the reviewer — **not** a problem with this',
              'pull request, its branch, or its diff.',
              '',
              '- No findings were produced, and none were lost.',
              '- This check is advisory; nothing here blocks the merge.',
              '- **Admin action:** top up the AI credit balance, then re-run the review by',
              '  converting this PR to a draft and back to ready.',
              '',
              `<sub>[Workflow run](${runUrl}) · the full provider response is in the run's \`ocr-review-result\` artifact.</sub>`,
            ].join('\n');

            const prNumber = Number(process.env.PR_NUMBER);
            if (Number.isInteger(prNumber) && prNumber > 0) {
              const { owner, repo } = context.repo;
              // Sticky: one notice per PR, rewritten in place, so repeated
              // runs against an empty balance do not stack up.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: prNumber, per_page: 100,
              });
              const existing = comments.find((c) => c.body && c.body.includes(MARKER));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
              }
            } else {
              core.warning('No PR number resolved; skipping the PR comment.');
            }

            core.warning(
              `AI review skipped: ${host} returned HTTP 402 (out of credit). ` +
              'Top up the AI account and re-run the review — the PR itself is fine.'
            );
            await core.summary.addRaw(body.replace(MARKER, '')).write();
