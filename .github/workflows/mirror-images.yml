name: Mirror Images

# Copies third-party images the estate's Dockerfiles depend on into
# ghcr.io/monowai, so an image build never pulls them anonymously from a
# registry that rations anonymous pulls.
#
# Today that is one image: the Lambda Web Adapter, which exists only on
# public.ecr.aws and which ruby's docker/Dockerfile copies in. ECR rations
# anonymous pulls per source IP, and GitHub's runners share their IPs, so
# ruby's main image build failed with "toomanyrequests: Data limit exceeded"
# in runs 36138945219 and 36653512927 through no change of its own.
#
# It lives here, not in ruby, because this repository is public: its runs
# cost no Actions minutes, the mirror can be public so any repository or
# laptop pulls it without logging in, and a second service moving to Lambda
# finds it already here.
#
# Run it by hand when a Dockerfile moves to a new adapter version, then pin
# the Dockerfile to the tag and the digest this prints in the job summary:
#   gh workflow run mirror-images.yml -R monowai/.github -f version=<x.y.z>
#
# The copy itself pulls from ECR on a GitHub runner, so it can meet the same
# limit. It is one pull per version: re-run it.
#
# Authenticates with the built-in GITHUB_TOKEN and `packages: write`, as
# build-base-image.yml does. The first run creates the package, linked to
# this repository. Check it is public (README).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'aws-lambda-adapter version to mirror'
        required: true
        default: '0.9.1'

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror aws-lambda-adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      # Pinned to a commit, not a tag: this job holds a token that can push
      # packages, and a tag can be moved by whoever controls the action.
      - name: Login to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # imagetools copies the multi-arch index. Consumers pin the mirror's
      # digest, printed in the summary. A digest that differs from upstream's
      # is reported, not refused: the tag is already pushed by then, and the
      # pin is what a build trusts.
      - name: Copy the image
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a version: $VERSION"; exit 1; }
          src="public.ecr.aws/awsguru/aws-lambda-adapter:${VERSION}"
          dst="ghcr.io/monowai/aws-lambda-adapter:${VERSION}"
          docker buildx imagetools create --tag "$dst" "$src"
          src_digest="$(docker buildx imagetools inspect "$src" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          dst_digest="$(docker buildx imagetools inspect "$dst" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ "$src_digest" = "$dst_digest" ] || echo "::warning::mirror digest $dst_digest differs from upstream's $src_digest"
          {
            echo "## Mirrored"
            echo '```'
            echo "${dst}@${dst_digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
