name: TestFlight (reusable)

# Archives an iOS or tvOS app, signs it for the App Store, uploads it to
# TestFlight, tags the commit <platform>/<version>+<build> and publishes a
# prerelease GitHub Release with notes since that platform's previous one.
#
# A release is a commit type. The squash-merged subject names the platforms it
# ships: `release(ios): ...`, `release(tvos): ...`, `release(ios,tvos): ...`
# (Google Play will be `release(android)`). Callers call this workflow once per
# platform, after their own tests pass, on any push to main whose subject starts
# `release(`, or on workflow_dispatch. The `release` job below reads the scope
# and goes on only when it names this call's platform, because a caller's `if:`
# expression cannot split a scope list. A dispatch releases every platform,
# unless the caller's workflow_dispatch has a `platforms` input (e.g. "tvos")
# naming the ones to ship.
#
# Everything app-specific lives in the caller's repository, nothing in here.
#
# Callers pin @v1. To roll a change out to every app, move the v1 tag.
#
# Signing uses a keychain that exists for this job only. The self-hosted macOS
# runner (kauri-mac, network/GH_MAC_RUNNER.md) is shared by every app
# repository's PR builds, so the distribution certificate, the provisioning
# profiles and the App Store Connect key are installed at the start and removed
# at the end, pass or fail. Nothing persists in the runner account.
#
# Secrets come from the caller's `app-store` environment: the job below names
# it, which is how a reusable workflow reaches environment secrets. The caller
# passes each one by name rather than `secrets: inherit`, because this
# repository is public and should see only what it uses.

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label. No hosted fallback: a release waits for kauri rather than billing macOS minutes."
        required: false
        type: string
        default: kauri-mac
      working-directory:
        description: "Directory holding the Xcode project (or project.yml), relative to the repository root."
        required: true
        type: string
      scheme:
        description: "Xcode scheme to archive."
        required: true
        type: string
      bundle-id:
        description: "The app's bundle identifier; finds its App Store Connect record."
        required: true
        type: string
      export-options:
        description: "ExportOptions.plist, relative to working-directory."
        required: false
        type: string
        default: ExportOptions.plist
      xcodegen:
        description: "Run `xcodegen generate` before archiving."
        required: false
        type: boolean
        default: true
      java-version:
        description: "Temurin JDK to install first, for apps whose build runs Gradle (Kotlin Multiplatform). Empty for none."
        required: false
        type: string
        default: ""
      platform:
        description: "ios or tvos. Picks the build destination and upload type, and names the release scope and tag prefix."
        required: false
        type: string
        default: ios
    secrets:
      ASC_KEY_ID:
        description: "App Store Connect API key ID."
        required: true
      ASC_ISSUER_ID:
        description: "App Store Connect API issuer ID."
        required: true
      ASC_KEY_P8:
        description: "The API key's .p8 file contents."
        required: true
      IOS_DIST_CERT_P12:
        description: "Apple Distribution certificate and private key, .p12, base64."
        required: true
      IOS_DIST_CERT_PASSWORD:
        description: "The .p12's password."
        required: true
      IOS_PROVISIONING_PROFILES:
        description: "Every App Store profile the archive signs with (app and extensions), as one gzipped tar, base64. Compressed because a secret holds at most 48 KB. scripts/app-store-secrets.sh writes it."
        required: true
      GH_GCR:
        description: "GitHub Packages token, for apps whose Gradle build pulls private packages. Reaches the archive step only."
        required: false

jobs:
  # Does this push release this platform? No secrets, no checkout.
  release:
    name: Release ${{ inputs.platform }}?
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    outputs:
      go: ${{ steps.scope.outputs.go }}
    steps:
      - id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          DISPATCH_PLATFORMS: ${{ github.event.inputs.platforms }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in ios|tvos) ;; *) echo "platform must be ios or tvos, not '$PLATFORM'" >&2; exit 1 ;; esac
          go=false
          if [[ "$EVENT" == workflow_dispatch ]]; then
            if [[ -z "${DISPATCH_PLATFORMS// /}" ]]; then
              go=true
            else
              IFS=, read -ra scopes <<<"${DISPATCH_PLATFORMS// /}"
              for scope in "${scopes[@]}"; do [[ "$scope" == "$PLATFORM" ]] && go=true; done
            fi
          else
            subject="${MESSAGE%%$'\n'*}"
            if [[ "$subject" =~ ^release\(([a-z0-9,\ ]+)\)!?: ]]; then
              IFS=, read -ra scopes <<<"${BASH_REMATCH[1]// /}"
              for scope in "${scopes[@]}"; do [[ "$scope" == "$PLATFORM" ]] && go=true; done
            fi
            echo "Subject: $subject"
          fi
          echo "Release $PLATFORM: $go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  testflight:
    name: TestFlight ${{ inputs.platform }}
    needs: release
    if: needs.release.outputs.go == 'true'
    runs-on: ${{ inputs.runner }}
    environment: app-store
    timeout-minutes: 60
    # Releases of one platform queue; a half-finished upload is never
    # cancelled. Per platform, so an iOS and a tvOS release never displace
    # each other's pending run.
    concurrency:
      group: testflight-${{ github.repository }}-${{ inputs.platform }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Everything this job writes lives under the runner's temp folder.
      - name: Work paths
        working-directory: .
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          {
            echo "KEYCHAIN=$RUNNER_TEMP/app-signing.keychain-db"
            echo "KEYS_DIR=$RUNNER_TEMP/private_keys"
            echo "ARCHIVE=$RUNNER_TEMP/app.xcarchive"
            echo "EXPORT=$RUNNER_TEMP/export"
            if [[ "$PLATFORM" == tvos ]]; then
              echo "DESTINATION=generic/platform=tvOS"
              echo "UPLOAD_TYPE=appletvos"
              echo "PLATFORM_NAME=tvOS"
            else
              echo "DESTINATION=generic/platform=iOS"
              echo "UPLOAD_TYPE=ios"
              echo "PLATFORM_NAME=iOS"
            fi
          } >> "$GITHUB_ENV"

      # The self-hosted runner keeps its workspace between jobs; a cancelled
      # fetch leaves a .lock that fails every later checkout.
      - name: Clear git locks a cancelled job left
        if: runner.environment == 'self-hosted'
        working-directory: .
        run: find "$GITHUB_WORKSPACE/.git" -name '*.lock' -type f -delete 2>/dev/null || true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: inputs.java-version != ''
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$KEYS_DIR"
          ( umask 077; printf '%s\n' "$ASC_KEY_P8" > "$KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8" )

      # The next build number is one past the highest App Store Connect holds
      # for this platform (each platform counts its own builds), so the
      # repository never carries a build number and a re-run after a failed
      # upload reuses the number nobody took. The JWT is signed with
      # openssl so the runner needs no Python packages.
      - name: Next build number
        id: asc
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ${{ inputs.bundle-id }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_OUTPUT"
          import base64, json, os, subprocess, time, urllib.parse, urllib.request

          key_id, issuer, bundle = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"], os.environ["BUNDLE_ID"]
          asc_platform = {"ios": "IOS", "tvos": "TV_OS"}[os.environ["PLATFORM"]]
          key_file = f"{os.environ['KEYS_DIR']}/AuthKey_{key_id}.p8"

          def b64(raw: bytes) -> bytes:
              return base64.urlsafe_b64encode(raw).rstrip(b"=")

          def der_to_raw(der: bytes) -> bytes:
              # ECDSA-Sig-Value ::= SEQUENCE { r INTEGER, s INTEGER }; a JWT wants r || s, 32 bytes each.
              i = 2 if der[1] < 0x80 else 2 + (der[1] & 0x7F)
              parts = []
              for _ in range(2):
                  assert der[i] == 0x02, "not a DER INTEGER"
                  length = der[i + 1]
                  parts.append(der[i + 2 : i + 2 + length].lstrip(b"\0").rjust(32, b"\0"))
                  i += 2 + length
              return b"".join(parts)

          now = int(time.time())
          signing_input = (
              b64(json.dumps({"alg": "ES256", "kid": key_id, "typ": "JWT"}).encode())
              + b"."
              + b64(json.dumps({"iss": issuer, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"}).encode())
          )
          der = subprocess.run(
              ["openssl", "dgst", "-sha256", "-sign", key_file], input=signing_input, capture_output=True, check=True
          ).stdout
          token = (signing_input + b"." + b64(der_to_raw(der))).decode()

          def get(path: str) -> dict:
              request = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com" + path, headers={"Authorization": f"Bearer {token}"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          apps = get("/v1/apps?" + urllib.parse.urlencode({"filter[bundleId]": bundle, "fields[apps]": "bundleId"}))["data"]
          app = next((a for a in apps if a["attributes"]["bundleId"] == bundle), None)
          if app is None:
              raise SystemExit(f"No App Store Connect app for {bundle}; create its record first")
          builds = get(
              "/v1/builds?"
              + urllib.parse.urlencode(
                  {
                      "filter[app]": app["id"],
                      "filter[preReleaseVersion.platform]": asc_platform,
                      "sort": "-uploadedDate",
                      "limit": 200,
                      "fields[builds]": "version",
                  }
              )
          )["data"]
          highest = max((int(b["attributes"]["version"]) for b in builds if b["attributes"]["version"].isdigit()), default=0)
          print(f"app-id={app['id']}")
          print(f"build={highest + 1}")
          EOF

      - name: Signing keychain and profiles
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILES: ${{ secrets.IOS_PROVISIONING_PROFILES }}
        run: |
          # The search list before this job, so cleanup can put it back.
          security list-keychains -d user | tr -d '"' | xargs > "$RUNNER_TEMP/keychains.orig"

          password=$(uuidgen)
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          ( umask 077; printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12" )
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          # Without the partition list, codesign asks for the keychain password in a dialog nobody sees.
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(cat "$RUNNER_TEMP/keychains.orig")

          # Xcode 16 and later read UserData; older tools read MobileDevice. Install to both.
          dirs=("$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles")
          mkdir -p "${dirs[@]}"
          : > "$RUNNER_TEMP/profiles.installed"
          unpacked="$RUNNER_TEMP/profiles"
          mkdir -p "$unpacked"
          printf '%s' "$PROFILES" | base64 --decode | tar -xzf - -C "$unpacked"
          for profile in "$unpacked"/*.mobileprovision; do
            [[ -f "$profile" ]] || { echo "IOS_PROVISIONING_PROFILES holds no profiles; re-run scripts/app-store-secrets.sh" >&2; exit 1; }
            uuid=$(security cms -D -i "$profile" | plutil -extract UUID raw -)
            name=$(security cms -D -i "$profile" | plutil -extract Name raw -)
            for dir in "${dirs[@]}"; do
              cp "$profile" "$dir/$uuid.mobileprovision"
              echo "$dir/$uuid.mobileprovision" >> "$RUNNER_TEMP/profiles.installed"
            done
            echo "Installed profile $name ($uuid)"
          done
          rm -rf "$unpacked"

      # Seconds here instead of a signing error deep in xcodebuild: every bundle
      # ID in ExportOptions.plist needs an installed App Store profile with
      # exactly that name and that bundle ID.
      - name: Profiles match ExportOptions
        env:
          EXPORT_OPTIONS: ${{ inputs.export-options }}
        run: |
          python3 - "$EXPORT_OPTIONS" "$RUNNER_TEMP/profiles.installed" <<'EOF'
          import plistlib, subprocess, sys

          export = plistlib.load(open(sys.argv[1], "rb"))
          team = export["teamID"]
          installed = {}
          for path in sorted(set(open(sys.argv[2]).read().split("\n")) - {""}):
              profile = plistlib.loads(subprocess.run(["security", "cms", "-D", "-i", path], capture_output=True, check=True).stdout)
              installed[(profile["Name"], profile["Entitlements"]["application-identifier"])] = path
          missing = [
              f"'{name}' for {bundle}"
              for bundle, name in export["provisioningProfiles"].items()
              if (name, f"{team}.{bundle}") not in installed
          ]
          if missing:
              have = ", ".join(f"'{n}' ({a.split('.', 1)[1]})" for n, a in sorted(installed))
              sys.exit(f"IOS_PROVISIONING_PROFILES lacks {'; '.join(missing)}. It holds: {have}. Re-run scripts/app-store-secrets.sh.")
          print("Every ExportOptions profile is installed")
          EOF

      - name: Generate Xcode project
        if: inputs.xcodegen
        run: xcodegen generate

      - name: Archive
        env:
          SCHEME: ${{ inputs.scheme }}
          BUILD: ${{ steps.asc.outputs.build }}
          GH_GCR: ${{ secrets.GH_GCR }}
        run: |
          xcodebuild archive \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "$DESTINATION" \
            -archivePath "$ARCHIVE" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CURRENT_PROJECT_VERSION="$BUILD" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"

      - name: Export IPA
        env:
          EXPORT_OPTIONS: ${{ inputs.export-options }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$EXPORT"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_ID: ${{ steps.asc.outputs.app-id }}
        run: |
          ipa=$(find "$EXPORT" -maxdepth 1 -name '*.ipa' | head -1)
          [[ -n "$ipa" ]] || { echo "No .ipa in $EXPORT" >&2; exit 1; }
          API_PRIVATE_KEYS_DIR="$KEYS_DIR" xcrun altool --upload-app \
            -f "$ipa" -t "$UPLOAD_TYPE" --apple-id "$APP_ID" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # The tag answers "which commit is TestFlight build N?" without guesswork.
      - name: Tag the commit
        id: tag
        env:
          BUILD: ${{ steps.asc.outputs.build }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleShortVersionString" "$ARCHIVE/Info.plist")
          tag="$PLATFORM/$version+$BUILD"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A prerelease (TestFlight is not the App Store), never marked latest, with
      # GitHub's generated notes since this platform's previous release tag.
      - name: GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_API: ${{ github.api_url }}
          TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          BUILD: ${{ steps.asc.outputs.build }}
          PLATFORM: ${{ inputs.platform }}
          SCHEME: ${{ inputs.scheme }}
        run: |
          previous=$(git ls-remote --tags --refs origin "refs/tags/$PLATFORM/*" |
            sed 's#.*refs/tags/##' | grep -vxF "$TAG" |
            awk -F+ '$2 ~ /^[0-9]+$/ {print $2, $0}' | sort -n | tail -1 | cut -d' ' -f2-)
          PREVIOUS="$previous" python3 - <<'EOF'
          import json, os, urllib.request

          api, repo, token = os.environ["GH_API"], os.environ["GH_REPO"], os.environ["TOKEN"]

          def post(path, body):
              request = urllib.request.Request(
                  f"{api}/repos/{repo}/{path}",
                  data=json.dumps(body).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          tag, previous = os.environ["TAG"], os.environ.get("PREVIOUS", "")
          notes_request = {"tag_name": tag}
          if previous:
              notes_request["previous_tag_name"] = previous
          notes = post("releases/generate-notes", notes_request)["body"]
          release = post(
              "releases",
              {
                  "tag_name": tag,
                  "name": f"{os.environ['SCHEME']} {os.environ['PLATFORM_NAME']} {os.environ['VERSION']} ({os.environ['BUILD']})",
                  "body": notes,
                  "prerelease": True,
                  "make_latest": "false",
              },
          )
          print(release["html_url"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(
                  f"### TestFlight {os.environ['PLATFORM_NAME']} build {os.environ['VERSION']} ({os.environ['BUILD']})\n\n"
                  f"Uploaded from `{os.environ['GITHUB_SHA'][:7]}`, tagged `{tag}`"
                  + (f", notes since `{previous}`" if previous else "")
                  + f". [Release]({release['html_url']}). App Store Connect takes a few minutes to process it.\n"
              )
          EOF

      - name: Remove signing material
        if: always()
        working-directory: .
        run: |
          if [[ -f "$RUNNER_TEMP/keychains.orig" ]]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains.orig")
          fi
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          if [[ -f "$RUNNER_TEMP/profiles.installed" ]]; then
            while IFS= read -r installed; do rm -f "$installed"; done < "$RUNNER_TEMP/profiles.installed"
          fi
          rm -rf "$KEYS_DIR" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profiles" "$ARCHIVE" "$EXPORT"
