name: Build Base Image

# Builds ghcr.io/monowai/eclipse-temurin, the shared JRE base image every
# Beancounter service extends: svc-data, svc-position, svc-event, svc-admin
# and svc-agent in beancounter, plus svc-retire and svc-rebalance.
#
# It lived in the beancounter repo, which made a cross-repo artifact look like
# one service's private business. The image name and tags are unchanged by the
# move, so no consumer Dockerfile needed touching.
#
# Authenticates with the built-in GITHUB_TOKEN and the `packages: write`
# permission below — no PAT to store or rotate. The beancounter original used a
# GH_TOKEN PAT despite already granting `packages: write`, which looks like
# habit rather than necessity.
#
# One-time setup, because the eclipse-temurin package predates this repo and is
# linked to beancounter: an existing package only accepts pushes from repos
# listed in its own access settings. Grant this one write, once:
#
#   ghcr.io/monowai/eclipse-temurin -> Package settings
#     -> Manage Actions access -> Add repository -> monowai/.github -> Write
#
# Without that grant the login succeeds and the push fails with 403 denied.

on:
  workflow_dispatch:
  push:
    paths:
      - 'docker/base/Dockerfile'
      - '.github/workflows/build-base-image.yml'
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: monowai/eclipse-temurin
  DOCKERFILE: docker/base/Dockerfile

jobs:
  docker:
    name: Build Docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract Sentry version from Dockerfile
        id: sentry
        run: |
          SENTRY_VERSION=$(grep 'ENV SENTRY_VERSION=' "${DOCKERFILE}" | cut -d'=' -f2)
          echo "version=${SENTRY_VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare platform tag
        id: prep
        run: |
          PLATFORM_TAG=$(echo "${{ matrix.platform }}" | sed 's/\//-/g')
          echo "platform_tag=$PLATFORM_TAG" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker/base
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:25-jre-alpine-sentry${{ steps.sentry.outputs.version }}-${{ steps.prep.outputs.platform_tag }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          # mode=min stores only final-stage layers — base image has a
          # single FROM, so mode=max offered no reuse benefit but accrued
          # GHA cache storage.
          cache-to: type=gha,scope=${{ matrix.platform }},mode=min
          provenance: false

  docker-manifest:
    name: Create Multi-arch Manifest
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract Sentry version from Dockerfile
        id: sentry
        run: |
          SENTRY_VERSION=$(grep 'ENV SENTRY_VERSION=' "${DOCKERFILE}" | cut -d'=' -f2)
          echo "version=${SENTRY_VERSION}" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG="25-jre-alpine-sentry${{ steps.sentry.outputs.version }}"

          # Create manifest for versioned tag
          docker manifest create ${IMAGE}:${TAG} \
            ${IMAGE}:${TAG}-linux-amd64 \
            ${IMAGE}:${TAG}-linux-arm64
          docker manifest push ${IMAGE}:${TAG}

          # Create manifest for latest tag
          docker manifest create ${IMAGE}:latest \
            ${IMAGE}:${TAG}-linux-amd64 \
            ${IMAGE}:${TAG}-linux-arm64
          docker manifest push ${IMAGE}:latest

      - name: Output image tags
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Multi-arch Images (amd64 + arm64):**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:25-jre-alpine-sentry${{ steps.sentry.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
